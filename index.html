<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eee9f7">
  <title>Alice Word Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Alice Word Game</h1>
      <p id="subtitle">Tìm những từ ẩn!</p>
    </header>

    <section class="card" aria-label="Game">
      <section class="account-panel">
        <div class="account-actions">
          <button id="google-sign-in" class="secondary-button" type="button">Đăng nhập Google</button>
          <button id="sign-out" class="secondary-button" type="button" hidden>Đăng xuất</button>
        </div>
        <p id="account-status" role="status" aria-live="polite">Đang ở chế độ khách.</p>
        <form id="profile-form" hidden>
          <label for="display-name" id="display-name-label">Tên hiển thị</label>
          <div class="profile-edit">
            <input id="display-name" maxlength="24" minlength="2" autocomplete="nickname" placeholder="Tên hiển thị">
            <button type="submit" id="save-profile">Lưu tên</button>
          </div>
        </form>
      </section>

      <div class="game-menu">
        <label><span class="sr-only">Language</span>
          <select id="language" aria-label="Language">
            <option value="vi">Tiếng Việt</option>
            <option value="en">English</option>
          </select>
        </label>
        <label><span class="sr-only">Difficulty</span>
          <select id="difficulty" aria-label="Difficulty">
            <option value="very-easy">Rất dễ</option>
            <option value="normal">Bình thường</option>
            <option value="very-hard">Rất khó</option>
          </select>
        </label>
      </div>

      <div class="utility-menu">
        <button id="help-button" class="secondary-button" type="button">Cách chơi</button>
        <button id="sound-button" class="secondary-button" type="button">Âm thanh: Bật</button>
        <button id="leaderboard-button" class="secondary-button" type="button">Bảng xếp hạng</button>
      </div>

      <div class="game-info">
        <p><span id="timer-label">Thời gian</span>: <strong id="timer">60</strong></p>
        <p><span id="score-label">Điểm</span>: <strong id="score">0</strong></p>
      </div>

      <div class="game-layout"><div class="board-column"><div id="game-grid" aria-label="Word search grid"></div></div><aside class="leaderboard-panel"><h2>Alice Leader · Top 20</h2><div class="leaderboard-controls"><select id="inline-leaderboard-language" aria-label="Leaderboard language"><option value="vi">Tiếng Việt</option><option value="en">English</option></select><select id="inline-leaderboard-difficulty" aria-label="Leaderboard difficulty"><option value="very-easy">Rất dễ</option><option value="normal" selected>Bình thường</option><option value="very-hard">Rất khó</option></select></div><ol id="inline-leaderboard-list"><li>Đang tải...</li></ol></aside></div>

      <div class="game-actions">
        <button id="start-game" type="button">Bắt đầu</button>
      </div>
      <p id="game-message" role="status" aria-live="polite"></p>
    </section>
  </main>

  <dialog id="help-dialog">
    <div class="dialog-content">
      <h2 id="help-title">Cách chơi</h2>
      <p id="help-copy">Tìm các từ ẩn bằng cách kéo qua những chữ cái theo đường thẳng.</p>
      <button id="close-help" type="button">Đã hiểu</button>
    </div>
  </dialog>

  <dialog id="leaderboard-dialog">
    <div class="dialog-content">
      <h2 id="leaderboard-title">Bảng xếp hạng</h2>
      <div class="leaderboard-controls">
        <select id="leaderboard-language" aria-label="Leaderboard language">
          <option value="vi">Tiếng Việt</option><option value="en">English</option>
        </select>
        <select id="leaderboard-difficulty" aria-label="Leaderboard difficulty">
          <option value="very-easy">Rất dễ</option><option value="normal">Bình thường</option><option value="very-hard">Rất khó</option>
        </select>
      </div>
      <ol id="leaderboard-list"><li>Chưa có dữ liệu.</li></ol>
      <button id="close-leaderboard" type="button">Đóng</button>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="script.js"></script>
  <script src="backend.js"></script>
</body>
</html>
