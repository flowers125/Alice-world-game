name: Validate game frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check backend.js

      - name: Verify required game assets
        run: |
          test -s index.html
          test -s style.css
          test -s supabase-config.js
          test -s dictionaries/vi.txt
          test -s dictionaries/en.txt
