name: Validate game frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check backend.js
          node --check supabase-config.js

      - name: Run game logic tests
        run: node --test tests/*.test.cjs

      - name: Set up Deno
        uses: denoland/setup-deno@v2

      - name: Type-check Supabase Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/alice-game/index.ts

      - name: Verify required game assets
        run: |
          test -s index.html
          test -s style.css
          test -s supabase-config.js
          test -s dictionaries/vi.txt
          test -s dictionaries/en.txt
